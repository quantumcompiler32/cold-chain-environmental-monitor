<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="620" viewBox="0 0 1050 620">
  <style>
    text{font-family:Arial,sans-serif;fill:#16233b}.h{font-size:24px;font-weight:bold}.s{font-size:18px}
    .box{fill:#fff;stroke:#1f5b8f;stroke-width:3;rx:18}.p{stroke-width:5;fill:none}
    .r{stroke:#d92d20}.k{stroke:#111827}.y{stroke:#eaaa08}.w{stroke:#667085}
  </style>
  <rect class="box" x="390" y="130" width="280" height="350"/>
  <text class="h" x="425" y="175">Arduino UNO R4 WiFi</text>
  <text class="s" x="430" y="230">5V</text>
  <text class="s" x="430" y="275">3.3V</text>
  <text class="s" x="430" y="320">GND</text>
  <text class="s" x="430" y="365">SDA / A4</text>
  <text class="s" x="430" y="410">SCL / A5</text>
  <text class="s" x="430" y="455">D2 (DHT OUT)</text>

  <rect class="box" x="30" y="70" width="270" height="220"/>
  <text class="h" x="100" y="110">BMP280</text>
  <text class="s" x="60" y="155">VDD → 3.3V</text>
  <text class="s" x="60" y="195">GND → GND</text>
  <text class="s" x="60" y="235">SDA → SDA / A4</text>
  <text class="s" x="60" y="275">SCL → SCL / A5</text>

  <rect class="box" x="30" y="360" width="270" height="180"/>
  <text class="h" x="105" y="400">DHT22</text>
  <text class="s" x="60" y="445">+ → 5V</text>
  <text class="s" x="60" y="485">OUT → D2</text>
  <text class="s" x="60" y="525">− → GND</text>

  <rect class="box" x="770" y="160" width="250" height="220"/>
  <text class="h" x="825" y="200">DS3231</text>
  <text class="s" x="800" y="245">VCC → 3.3V</text>
  <text class="s" x="800" y="285">GND → GND</text>
  <text class="s" x="800" y="325">SDA → SDA / A4</text>
  <text class="s" x="800" y="365">SCL → SCL / A5</text>

  <path class="p r" d="M300 150 C350 150 350 275 390 275"/>
  <path class="p k" d="M300 190 C350 190 350 320 390 320"/>
  <path class="p y" d="M300 230 C350 230 350 365 390 365"/>
  <path class="p w" d="M300 270 C350 270 350 410 390 410"/>
  <path class="p r" d="M300 440 C350 440 350 230 390 230"/>
  <path class="p y" d="M300 480 C350 480 350 455 390 455"/>
  <path class="p k" d="M300 520 C350 520 350 320 390 320"/>
  <path class="p r" d="M770 240 C720 240 720 275 670 275"/>
  <path class="p k" d="M770 280 C720 280 720 320 670 320"/>
  <path class="p y" d="M770 320 C720 320 720 365 670 365"/>
  <path class="p w" d="M770 360 C720 360 720 410 670 410"/>

  <text class="s" x="245" y="590">Required: DHT22 + BMP280. DS3231 and AHT20 are optional.</text>
</svg>

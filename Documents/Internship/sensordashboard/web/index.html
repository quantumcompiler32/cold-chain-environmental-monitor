<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartEdge — Observability Platform</title>
<style>
  :root {
    --bg: #0d0f14;
    --sidebar-bg: #0a0c10;
    --surface: #13161d;
    --surface2: #1a1e28;
    --border: rgba(255,255,255,0.07);
    --border-accent: rgba(255,255,255,0.14);
    --text: #e8eaf0;
    --muted: #6b7280;
    --dim: #9ca3af;
    --radius: 10px;
    --font: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'SF Mono', 'Fira Code', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
    font-size: 14px;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 228px;
    min-width: 228px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--border);
  }
  .logo-row { display: flex; align-items: center; gap: 10px; }
  .logo-mark {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff; letter-spacing: -0.5px;
  }
  .logo-text { line-height: 1.2; }
  .logo-name { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .logo-sub { font-size: 10px; color: var(--muted); letter-spacing: 0.4px; margin-top: 1px; }

  .section-label {
    font-size: 10px; font-weight: 600; letter-spacing: 1px;
    color: var(--muted); text-transform: uppercase;
    padding: 14px 16px 5px;
  }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px; cursor: pointer;
    border-left: 2px solid transparent;
    color: var(--dim); font-size: 13px;
    transition: background 0.12s, color 0.12s;
    user-select: none;
    text-decoration: none;
  }
  .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
  .nav-item.active {
    background: rgba(var(--rgb, 59,130,246), 0.08);
    border-left-color: rgb(var(--rgb, 59,130,246));
    color: var(--text);
  }
  .nav-icon {
    width: 22px; height: 22px; border-radius: 5px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    background: rgba(255,255,255,0.05);
    transition: background 0.12s;
  }
  .nav-item.active .nav-icon {
    background: rgba(var(--rgb, 59,130,246), 0.18);
  }
  .nav-label { flex: 1; }
  .nav-badge {
    font-size: 10px; font-weight: 700; padding: 2px 7px;
    border-radius: 20px; letter-spacing: 0.2px; flex-shrink: 0;
  }
  .badge-ok   { background: rgba(16,185,129,0.15);  color: #10b981; }
  .badge-warn { background: rgba(245,158,11,0.15);  color: #f59e0b; }
  .badge-crit { background: rgba(239,68,68,0.15);   color: #ef4444; }

  .nav-divider { height: 1px; background: var(--border); margin: 8px 0; }

  .sidebar-footer {
    margin-top: auto;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 9px;
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #10b981; flex-shrink: 0;
    animation: livepulse 2s ease-in-out infinite;
  }
  @keyframes livepulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
  .footer-text { font-size: 11px; color: var(--muted); }

  /* ── MAIN AREA ── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

  .topbar {
    height: 50px; flex-shrink: 0;
    background: var(--sidebar-bg);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 22px; gap: 14px;
  }
  .topbar-breadcrumb {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--muted);
  }
  .breadcrumb-sep { color: var(--border-accent); }
  .breadcrumb-current {
    display: flex; align-items: center; gap: 7px;
    font-weight: 500; color: var(--text);
  }
  .breadcrumb-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgb(var(--current-rgb, 59,130,246));
  }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .topbar-clock { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .topbar-btn {
    padding: 5px 13px; border-radius: 6px;
    border: 1px solid var(--border-accent);
    background: rgba(255,255,255,0.04);
    color: var(--dim); font-size: 12px; cursor: pointer;
    transition: background 0.12s, color 0.12s; font-family: inherit;
  }
  .topbar-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
  .topbar-sensor-count {
    font-size: 11px; color: var(--muted);
    padding: 4px 10px; border-radius: 20px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
  }

  /* ── IFRAME STAGE ── */
  .iframe-stage {
    flex: 1; overflow: hidden; position: relative; background: var(--bg);
  }
  .iframe-stage iframe {
    width: 100%; height: 100%;
    border: none; display: block;
  }

  /* ── LOADING OVERLAY ── */
  .loader {
    position: absolute; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    z-index: 10; transition: opacity 0.3s;
  }
  .loader.hidden { opacity: 0; pointer-events: none; }
  .loader-spinner {
    width: 32px; height: 32px; border-radius: 50%;
    border: 2px solid var(--border-accent);
    border-top-color: rgb(var(--current-rgb, 59,130,246));
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-text { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo-row">
      <div class="logo-mark">SE</div>
      <div class="logo-text">
        <div class="logo-name">SmartEdge</div>
        <div class="logo-sub">OBSERVABILITY PLATFORM</div>
      </div>
    </div>
  </div>

  <div class="section-label">Domains</div>

  <div class="nav-item active" style="--rgb:59,130,246"
       data-src="pages/domain-cooling.html"
       data-label="Data Center Cooling"
       data-sensors="8 sensors · Rack Hall A–D"
       data-rgb="59,130,246"
       onclick="navigate(this)">
    <div class="nav-icon">❄️</div>
    <span class="nav-label">Data Center Cooling</span>
    <span class="nav-badge badge-warn">2</span>
  </div>

  <div class="nav-item" style="--rgb:239,68,68"
       data-src="pages/domain-fire.html"
       data-label="Fire Weather Monitoring"
       data-sensors="24 stations · Northern Region"
       data-rgb="239,68,68"
       onclick="navigate(this)">
    <div class="nav-icon">🔥</div>
    <span class="nav-label">Fire Weather</span>
    <span class="nav-badge badge-crit">5</span>
  </div>

  <div class="nav-item" style="--rgb:139,92,246"
       data-src="pages/domain-vaccine.html"
       data-label="Vaccine Cold Chain"
       data-sensors="6 units · Clinic Network"
       data-rgb="139,92,246"
       onclick="navigate(this)">
    <div class="nav-icon">💉</div>
    <span class="nav-label">Vaccine Cold Chain</span>
    <span class="nav-badge badge-ok">OK</span>
  </div>

  <div class="nav-item" style="--rgb:16,185,129"
       data-src="pages/domain-energy.html"
       data-label="Building Energy Efficiency"
       data-sensors="42 sensors · HQ Campus"
       data-rgb="16,185,129"
       onclick="navigate(this)">
    <div class="nav-icon">⚡</div>
    <span class="nav-label">Building Energy</span>
    <span class="nav-badge badge-ok">OK</span>
  </div>

  <div class="nav-item" style="--rgb:245,158,11"
       data-src="pages/domain-air.html"
       data-label="Air Quality Monitoring"
       data-sensors="32 stations · Metro Area"
       data-rgb="245,158,11"
       onclick="navigate(this)">
    <div class="nav-icon">🌬️</div>
    <span class="nav-label">Air Quality</span>
    <span class="nav-badge badge-warn">3</span>
  </div>

  <div class="nav-divider"></div>
  <div class="section-label">System</div>

  <div class="nav-item" style="--rgb:107,114,128"
       data-src="pages/settings.html"
       data-label="Settings"
       data-sensors="Platform configuration"
       data-rgb="107,114,128"
       onclick="navigate(this)">
    <div class="nav-icon">⚙️</div>
    <span class="nav-label">Settings</span>
  </div>

  <div class="nav-item" style="--rgb:107,114,128"
       data-src="pages/audit-log.html"
       data-label="Audit Log"
       data-sensors="Security &amp; compliance"
       data-rgb="107,114,128"
       onclick="navigate(this)">
    <div class="nav-icon">📋</div>
    <span class="nav-label">Audit Log</span>
  </div>

  <div class="sidebar-footer">
    <div class="live-dot"></div>
    <div class="footer-text" id="sensorCount">Live · 32 sensors online</div>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-breadcrumb">
      <span>SensorGrid</span>
      <span class="breadcrumb-sep">›</span>
      <span class="breadcrumb-current">
        <span class="breadcrumb-dot" id="breadcrumbDot"></span>
        <span id="breadcrumbLabel">Data Center Cooling</span>
      </span>
    </div>
    <span class="topbar-sensor-count" id="topbarSensors">8 sensors · Rack Hall A–D</span>
    <div class="topbar-right">
      <span class="topbar-clock" id="clock"></span>
      <button class="topbar-btn" onclick="reloadFrame()">↻ Refresh</button>
    </div>
  </div>

  <div class="iframe-stage" id="stage">
    <div class="loader" id="loader">
      <div class="loader-spinner" id="loaderSpinner"></div>
      <div class="loader-text" id="loaderText">Loading domain…</div>
    </div>
    <iframe id="contentFrame" src="pages/domain-cooling.html" title="Domain content"
            onload="frameLoaded()"></iframe>
  </div>
</div>

<script>
  // ── Clock ──
  function tick() {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('en-US', { hour12: false });
  }
  setInterval(tick, 1000); tick();

  // ── Navigation ──
  function navigate(el) {
    if (el.classList.contains('active')) return;

    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');

    const src      = el.dataset.src;
    const label    = el.dataset.label;
    const sensors  = el.dataset.sensors;
    const rgb      = el.dataset.rgb || '107,114,128';

    // Update topbar
    document.getElementById('breadcrumbLabel').textContent = label;
    document.getElementById('topbarSensors').textContent   = sensors;
    document.getElementById('breadcrumbDot').style.background = `rgb(${rgb})`;
    document.getElementById('loaderSpinner').style.borderTopColor = `rgb(${rgb})`;
    document.documentElement.style.setProperty('--current-rgb', rgb);

    // Show loader, swap iframe src
    showLoader(label);
    document.getElementById('contentFrame').src = src;
  }

  function showLoader(label) {
    const loader = document.getElementById('loader');
    document.getElementById('loaderText').textContent = 'Loading ' + label + '…';
    loader.classList.remove('hidden');
  }

  function frameLoaded() {
    document.getElementById('loader').classList.add('hidden');
  }

  function reloadFrame() {
    const frame = document.getElementById('contentFrame');
    const src = frame.src;
    showLoader('');
    frame.src = '';
    setTimeout(() => { frame.src = src; }, 50);
  }

  // ── Init topbar color from first active item ──
  (function() {
    const active = document.querySelector('.nav-item.active');
    if (active) {
      const rgb = active.dataset.rgb || '59,130,246';
      document.getElementById('breadcrumbDot').style.background = `rgb(${rgb})`;
      document.getElementById('loaderSpinner').style.borderTopColor = `rgb(${rgb})`;
      document.documentElement.style.setProperty('--current-rgb', rgb);
    }
  })();
</script>
</body>
</html>
